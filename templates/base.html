<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ config.title }}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    />
    <link rel="stylesheet" href="{{ get_url(path='css/main.css') | safe }}" />
  </head>
  <body>
    <header class="fixed left-0 top-0 w-full z-10">
      <div class="bg-neutral-100 flex items-center justify-between opacity-90 relative">
        <div>
          <img class="h-16" alt="Scott King logo" src="/scott-logo-light.png" />
        </div>
        <div class="md:hidden px-4">
          <button
            id="menu-button"
            class="flex font-medium hover:bg-neutral-200 items-center px-4 py-2 ring-red-400 ring-1 rounded-full shadow-lg text-sm text-neutral-800"
          >
            Menu
          </button>
        </div>
        <nav
          id="main-nav"
          class="inset-x-4 fixed invisible md:block md:visible md:relative md:top-0 origin-top top-20 z-0"
          aria-label="Main menu"
        >
          <ul
            class="bg-neutral-200 flex flex-col opacity-0 p-4 rounded-md md:bg-neutral-100 md:flex md:flex-row md:justify-end md:mr-4 md:opacity-100 md:space-x-8 md:space-y-0 md:top-0 md:visible relative space-y-4 transition-[opacity] ease-in-out duration-500"
          >
            <li class="duration-200 flex hover:text-red-800 justify-center text-base transition-colors">
              <a href="/">Home</a>
            </li>
            <li class="duration-200 flex hover:text-red-800 justify-center text-base transition-colors">
              <a href="/contact/">Contact</a>
            </li>
            <li class="duration-200 flex hover:text-red-800 justify-center text-base transition-colors">
              <a href="/projects/">Creative Work</a>
            </li>
            <li class="duration-200 flex hover:text-red-800 justify-center text-base transition-colors">
              <a href="/scott-king-cv.pdf">CV</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="flex pt-20 px-8">{% block content %}{% endblock %}</main>
    <script>
      const menuButton = document.getElementById("menu-button");
      const nav = document.getElementById("main-nav");
      menuButton.addEventListener("click", () => {
        nav.classList.toggle("invisible");
        nav.querySelector("ul").classList.toggle("opacity-0");
      });
    </script>
  </body>
</html>
