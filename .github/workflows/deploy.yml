name: Deploy to nearlyfreespeech.net

on:
  push:
    branches: [main]
  pull_request:

env:
  ZOLA_VERSION: 0.22.1
  TAILWIND_VERSION: 4.3.3

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zola and tailwindcss
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/bin"
          curl -sSfL -o "$HOME/bin/tailwindcss" \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x "$HOME/bin/tailwindcss"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build site
        run: make build

      - name: Check links
        run: zola check

      - name: Deploy to NFSN
        if: github.event_name == 'push'
        env:
          NFSN_SSH_KEY: ${{ secrets.NFSN_SSH_KEY }}
          NFSN_KNOWN_HOSTS: ${{ secrets.NFSN_KNOWN_HOSTS }}
          NFSN_SSH_DESTINATION: ${{ secrets.NFSN_SSH_DESTINATION }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$NFSN_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$NFSN_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            public/ "$NFSN_SSH_DESTINATION:/home/public/"
